services:
  - type: web
    name: bookora
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && python manage.py seed_demo && gunicorn bookora.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "bookora.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: bookora-db
          property: connectionString

databases:
  - name: bookora-db
    plan: free
